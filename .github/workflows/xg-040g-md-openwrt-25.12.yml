name: Build_XG_040G_MD_OpenWrt_25_12

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      log_switch:
        description: "Build logs"
        required: false
        default: true
        type: boolean
  schedule:
    # 每周一 00:00 Asia/Shanghai = 周日 16:00 UTC
    - cron: "0 16 * * 0"

env:
  CONFIG_FILE: "config/xg-040g-md.config"
  REPO_URL: https://github.com/xiangtailiang/openwrt.git
  REPO_BRANCH: openwrt-25.12
  FEEDS_CONF: feeds.conf.default
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  KEEP_RELEASES: 20
  KEEP_RELEASE_MARKER: "[keep-release]"
  CCACHE_DIR: /mnt/openwrt/ccache
  CCACHE_MAXSIZE: 5G
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true

      - name: Space usage check
        run: df -h

      - name: Setup environment dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: ${{ env.TZ }}
        run: |
          sudo apt update
          sudo apt purge -y python3-distutils || true
          sudo apt autoremove -y
          sudo apt install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            mkbootimg device-tree-compiler ccache help2man
          if command -v mkbootimg >/dev/null 2>&1; then
            echo "mkbootimg found at: $(command -v mkbootimg)"
          else
            echo "❌ mkbootimg not found in PATH!"
          fi

          if [[ -n "$TZ" ]]; then
            sudo timedatectl set-timezone "$TZ"
          else
            echo "TZ is not set, skipping timezone setup."
          fi

      - name: Ensure Python build tools
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install Unidecode

      - name: Clone OpenWrt source code (openwrt-25.12)
        run: |
          git clone --depth 1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt

      - name: Move build dirs to /mnt/openwrt
        run: |
          sudo mkdir -p /mnt/openwrt/{dl,staging_dir,build_dir,ccache}
          sudo chown -R "$USER:$(id -gn)" /mnt/openwrt
          rm -rf openwrt/dl openwrt/staging_dir openwrt/build_dir
          ln -sfn /mnt/openwrt/dl openwrt/dl
          ln -sfn /mnt/openwrt/staging_dir openwrt/staging_dir
          ln -sfn /mnt/openwrt/build_dir openwrt/build_dir
          df -h

      - name: Restore dl cache
        uses: actions/cache@v4
        with:
          path: /mnt/openwrt/dl
          key: ${{ runner.os }}-openwrt-${{ env.REPO_BRANCH }}-dl-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-${{ env.REPO_BRANCH }}-dl-

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/openwrt/ccache
          key: ${{ runner.os }}-openwrt-${{ env.REPO_BRANCH }}-ccache-v2-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-openwrt-${{ env.REPO_BRANCH }}-ccache-v2-

      - name: Setup ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          echo "ccache dir: $CCACHE_DIR"
          ccache -s

      - name: Update & Install feeds
        working-directory: ./openwrt
        run: |
          # 复制基础 feeds 配置
          cp "$GITHUB_WORKSPACE/feeds.conf.default" feeds.conf.default
          # 追加 iStore 第三方 feed
          echo "" >> feeds.conf.default
          echo "src-git istore https://github.com/linkease/istore;main" >> feeds.conf.default
          # 更新所有 feed（包括刚追加的 istore）
          ./scripts/feeds update -a
          # 安装所有 feed 的包到 package/feeds/
          ./scripts/feeds install -a -f
          # 专门从 istore feed 安装 luci-app-store（-d y 自动启用依赖）
          ./scripts/feeds install -d y -p istore luci-app-store
          # Fix 1: iStore条件依赖兼容性修复（整行替换opkg条件依赖为 +apk-mbedtls +luci-compat）
          if [ -f package/feeds/istore/luci-app-store/Makefile ]; then
            sed -i '/LUCI_DEPENDS+=.*opkg/c\LUCI_DEPENDS+=+apk-mbedtls +luci-compat' package/feeds/istore/luci-app-store/Makefile
            echo "iStore Fix 1 applied: conditional dependency replaced with +apk-mbedtls +luci-compat"
          fi
          # Fix 2: 移除三个不存在的依赖（+tar +libuci-lua +mount-utils）
          if [ -f package/feeds/istore/luci-app-store/Makefile ]; then
            sed -i 's/+tar +libuci-lua +mount-utils //' package/feeds/istore/luci-app-store/Makefile
            echo "iStore Fix 2 applied: non-existent dependencies removed (tar, libuci-lua, mount-utils)"
          fi
          # 追加 OpenAppFilter 第三方 feed
          echo "" >> feeds.conf.default
          echo "src-git oaf https://github.com/destan19/OpenAppFilter;master" >> feeds.conf.default
          # 更新 OAF feed
          ./scripts/feeds update oaf
          # 安装 OAF 相关包
          ./scripts/feeds install -d y -p oaf luci-app-oaf
          # 修复OAF内核模块6.15+内核EXTRA_CFLAGS失效问题，官方标准方案：转ccflags-y
          OAF_SRC_MAKEFILE="package/feeds/oaf/oaf/src/Makefile"
          if [ -f "$OAF_SRC_MAKEFILE" ]; then
              echo "" >> "$OAF_SRC_MAKEFILE"
              echo "ccflags-y += \$(EXTRA_CFLAGS)" >> "$OAF_SRC_MAKEFILE"
          fi
      - name: Install third-party packages (homeproxy, passwall)
        working-directory: ./openwrt/package
        run: |
          chmod +x $GITHUB_WORKSPACE/scripts/update-packages.sh
          bash $GITHUB_WORKSPACE/scripts/update-packages.sh
          
      - name: Add NPU plugin
        working-directory: ./openwrt/package
        run: |
          git clone https://github.com/luanmuc/luci-app-airoha-npu.git luci-app-airoha-npu
          
      - name: Apply base-files patch
        run: cp -rv $GITHUB_WORKSPACE/patch/base-files/* openwrt/package/base-files/files/
          
      - name: Hotfix rust llvm CI option
        working-directory: ./openwrt
        run: |
          sed -i 's/--set=llvm.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/'             feeds/packages/lang/rust/Makefile
          grep -n "download-ci-llvm" feeds/packages/lang/rust/Makefile

      - name: Copy configuration and defconfig
        run: |
          cp -fv "${CONFIG_FILE}" openwrt/.config
          cd openwrt
          
          make defconfig
          
          # 8步验证：iStore集成验证（defconfig后执行，任意一步失败立即终止）
          echo "=== 1/8 验证 feeds.conf.default 中存在 istore 配置 ==="
          grep -q "istore" feeds.conf.default || { echo "FAIL: istore feed not found in feeds.conf.default"; exit 1; }
          echo "PASS"
          
          echo "=== 2/8 验证 feeds list 能列出 luci-app-store ==="
          ./scripts/feeds list -r istore | grep -q "luci-app-store" || { echo "FAIL: luci-app-store not found in istore feed list"; exit 1; }
          echo "PASS"
          
          echo "=== 3/8 验证 luci-app-store/Makefile 存在 ==="
          [ -f package/feeds/istore/luci-app-store/Makefile ] || { echo "FAIL: luci-app-store/Makefile not found"; exit 1; }
          echo "PASS"
          
          echo "=== 4/8 验证 luci-lib-taskd/Makefile 存在 ==="
          [ -f package/feeds/istore/luci-lib-taskd/Makefile ] || { echo "FAIL: luci-lib-taskd/Makefile not found"; exit 1; }
          echo "PASS"
          
          echo "=== 5/8 验证 luci-lib-xterm/Makefile 存在 ==="
          [ -f package/feeds/istore/luci-lib-xterm/Makefile ] || { echo "FAIL: luci-lib-xterm/Makefile not found"; exit 1; }
          echo "PASS"
          
          echo "=== 6/8 验证 taskd/Makefile 存在 ==="
          [ -f package/feeds/istore/taskd/Makefile ] || { echo "FAIL: taskd/Makefile not found"; exit 1; }
          echo "PASS"
          
          echo "=== 7/8 验证 luci-compat/Makefile 存在 ==="
          [ -f package/feeds/luci/luci-compat/Makefile ] || { echo "FAIL: luci-compat/Makefile not found"; exit 1; }
          echo "PASS"
          
          echo "=== 8/8 验证 .config 中 CONFIG_PACKAGE_luci-app-store=y ==="
          if grep -q "CONFIG_PACKAGE_luci-app-store=y" .config; then
            echo "PASS (official method)"
            ISTORE_MODE="official"
          else
            echo "WARN: official method failed, executing fallback..."
            # Fallback兜底机制：手动追加5个iStore相关包到.config末尾
            echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
            echo "CONFIG_PACKAGE_luci-lib-taskd=y" >> .config
            echo "CONFIG_PACKAGE_luci-lib-xterm=y" >> .config
            echo "CONFIG_PACKAGE_taskd=y" >> .config
            echo "CONFIG_PACKAGE_luci-compat=y" >> .config
            # 再次验证
            if grep -q "CONFIG_PACKAGE_luci-app-store=y" .config; then
              echo "PASS (fallback method)"
              ISTORE_MODE="fallback"
            else
              echo "FAIL: fallback also failed"
              exit 1
            fi
          fi
          
          echo "=== 全部 8 步验证通过 (iStore mode: $ISTORE_MODE) ==="
          
          # 7步验证：OpenAppFilter集成验证（任意一步失败立即终止）
          echo "=== 1/7 验证 feeds.conf.default 中存在 oaf 配置 ==="
          grep -q "oaf" feeds.conf.default || { echo "FAIL: oaf feed not found in feeds.conf.default"; exit 1; }
          echo "PASS"
          
          echo "=== 2/7 验证 feeds list 能列出 luci-app-oaf ==="
          ./scripts/feeds list -r oaf | grep -q "luci-app-oaf" || { echo "FAIL: luci-app-oaf not found in oaf feed list"; exit 1; }
          echo "PASS"
          
          echo "=== 3/7 验证 luci-app-oaf/Makefile 存在 ==="
          [ -f package/feeds/oaf/luci-app-oaf/Makefile ] || { echo "FAIL: luci-app-oaf/Makefile not found"; exit 1; }
          echo "PASS"
          
          echo "=== 4/7 验证 oaf 内核模块 Makefile 存在 ==="
          [ -f package/feeds/oaf/oaf/Makefile ] || { echo "FAIL: oaf kernel module Makefile not found"; exit 1; }
          echo "PASS"
          
          echo "=== 5/7 验证 appfilter 规则文件存在 ==="
          [ -f package/feeds/oaf/open-app-filter/Makefile ] || { echo "FAIL: open-app-filter package Makefile not found"; exit 1; }
          echo "PASS"
          
          echo "=== 6/7 验证 luci-compat/Makefile 存在（OAF依赖） ==="
          [ -f package/feeds/luci/luci-compat/Makefile ] || { echo "FAIL: luci-compat/Makefile not found"; exit 1; }
          echo "PASS"
          
          echo "=== 7/7 验证 .config 中 CONFIG_PACKAGE_luci-app-oaf=y ==="
          grep -q "CONFIG_PACKAGE_luci-app-oaf=y" .config || { echo "FAIL: CONFIG_PACKAGE_luci-app-oaf not set to y"; exit 1; }
          echo "PASS"
          
          echo "=== OAF 全部 7 步验证通过 ==="
          
          [ -e .config ] && cp .config defconfig-final.config

      - name: Upload build config files
        uses: actions/upload-artifact@v6
        with:
          name: build-config
          path: |
            config/xg-040g-md.config
            openwrt/defconfig-final.config
            openwrt/feeds.conf.default

      - name: Download packages
        working-directory: ./openwrt
        run: |
          # 配置 curl 全局重试：重试5次，连接超时30s，总超时300s
          echo "retry = 5" >> ~/.curlrc
          echo "retry-delay = 5" >> ~/.curlrc
          echo "connect-timeout = 30" >> ~/.curlrc
          echo "max-time = 300" >> ~/.curlrc
          make download -j4 V=s
          # Remove small incomplete files <1KB
          find dl -size -1024c -delete

      - name: Compile OpenWrt firmware
        id: compile
        run: |
          cd openwrt
          echo "Disk usage before compile:"
          df -h
          echo "Stage 1: Multi-threaded fast compile with -j$(nproc)"
          make -j$(nproc) || {
            echo "Stage 1 failed, falling back to Stage 2: Single-threaded verbose compile with -j1 V=s"
            make -j1 V=s || {
              echo "Compile failed, disk usage diagnostics:"
              df -h
              du -h -d1 . | sort -h | tail -n 30
              exit 1
            }
          }
          DEVICE_NAME=$(grep -o 'CONFIG_TARGET.*DEVICE_[^=]*=y' .config | head -1 | sed 's/.*DEVICE_\(.*\)=y/\1/')
          if [[ -n "$DEVICE_NAME" ]]; then
            echo "DEVICE_NAME=_${DEVICE_NAME}" >> "$GITHUB_ENV"
          fi
          echo "FILE_DATE=_$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"
          echo "status=success" >> $GITHUB_OUTPUT
          echo "ccache stats (env CCACHE_DIR=$CCACHE_DIR):"
          ccache -s || true

      - name: Save ccache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: /mnt/openwrt/ccache
          key: ${{ runner.os }}-openwrt-${{ env.REPO_BRANCH }}-ccache-v2-${{ github.run_id }}

      - name: Prepare firmware artifacts path
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        if: env.UPLOAD_FIRMWARE == 'true'
        with:
          name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}/*

      - name: Generate release tag and notes
        id: tag
        if: env.UPLOAD_RELEASE == 'true'
        run: |
          RELEASE_DATE=$(date +"%Y.%m.%d-%H%M%S")
          echo "release_tag=v${RELEASE_DATE}-openwrt-25.12" >> $GITHUB_OUTPUT
          echo "release_name=OpenWrt-25.12-${RELEASE_DATE}" >> $GITHUB_OUTPUT
          cat <<EOF > release.txt
          🚀 OpenWrt firmware for XG-040G-MD (openwrt-25.12)
          ----------------------
          设备型号: XG-040G-MD
          构建时间: $(date +"%Y-%m-%d %H:%M")
          内核版本: 6.12.X
          源码仓库: $REPO_URL
          分支: $REPO_BRANCH
          EOF

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        if: env.UPLOAD_RELEASE == 'true'
        with:
          tag: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_name }}
          bodyFile: release.txt
          artifacts: |
            ${{ env.FIRMWARE }}/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 7
          keep_minimum_runs: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old GitHub Releases
        if: env.UPLOAD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_RELEASES: ${{ env.KEEP_RELEASES }}
          KEEP_RELEASE_MARKER: ${{ env.KEEP_RELEASE_MARKER }}
        run: bash scripts/cleanup-old-releases.sh
